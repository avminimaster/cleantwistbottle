<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grazie - Clean Twist Bottle</title>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      font-family:Arial,sans-serif;
      background:linear-gradient(to bottom,#eef4f2,#f7f7f5);
      color:#222;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .card{
      background:white;
      padding:50px 40px;
      border-radius:28px;
      box-shadow:0 20px 50px rgba(0,0,0,0.10);
      text-align:center;
      max-width:600px;
      width:100%;
    }

    h1{
      font-size:3rem;
      margin-bottom:20px;
      color:#587558;
    }

    p{
      color:#666;
      margin-bottom:18px;
      font-size:1.1rem;
      line-height:1.6;
    }

    .button{
      display:inline-block;
      margin-top:25px;
      padding:16px 32px;
      background:#587558;
      color:white;
      text-decoration:none;
      border-radius:14px;
      font-size:1rem;
      transition:0.2s;
      box-shadow:0 10px 25px rgba(88,117,88,0.18);
    }

    .button:hover{
      background:#476247;
      transform:translateY(-2px);
    }

    @media (max-width:768px){

      .card{
        padding:40px 25px;
      }

      h1{
        font-size:2.2rem;
      }

      p{
        font-size:1rem;
      }

    }
  </style>
</head>

<body>

  <div class="card">

    <h1>Grazie!</h1>

    <p>
      La tua richiesta è stata inviata correttamente.
    </p>

    <p>
      Ti contatteremo il prima possibile.
    </p>

    <a class="button"
       href="https://avminimaster.github.io/cleantwistbottle/">

      Torna alla homepage

    </a>

  </div>

</body>
</html>
